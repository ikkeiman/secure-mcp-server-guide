[project]
name = "secure-mcp-server-guide"
version = "0.1.0"
description = "Claude Desktop 向け MCP サーバーを安全に作るためのガイドと、読み取り専用の参照実装"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["reference/tests"]
pythonpath = ["reference"]
addopts = "-q"
